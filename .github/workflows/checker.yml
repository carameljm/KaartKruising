name: Kruising Checker Pipeline

on:
  schedule:
    - cron: "0 3 * * *" # Every night at 03:00
  workflow_dispatch:

jobs:
  run-checker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Kruising Checker
        run: |
          if [ -d "buurtwegenomgevingsdossiers-main" ]; then
            python kruising_checker.py --roads-dir buurtwegenomgevingsdossiers-main --days 7 --output output_maps
          else
            python kruising_checker.py --roads-dir . --days 7 --output output_maps
          fi

      - name: Commit and Push Dashboard Data
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add output_maps/matches.json
          git commit -m "Update dashboard data [skip ci]" || exit 0
          git push
