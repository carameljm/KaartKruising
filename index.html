<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kruising Checker | Geo-Insights</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        .map-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }
        .map-modal.active { display: flex; }
        .map-modal-content {
            width: 90vw;
            height: 80vh;
            max-width: 1200px;
            background: var(--bg-dark);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            border: 1px solid var(--glass-border);
        }
        .map-modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 10;
            background: var(--bg-dark);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 8px 14px;
            color: var(--text-main);
            cursor: pointer;
            font-size: 0.85rem;
        }
        .map-modal-close:hover { border-color: var(--primary); }
        .map-modal-title {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 8px 14px;
            color: var(--text-main);
            font-size: 0.85rem;
            max-width: 60%;
        }
        .map-modal-title h4 { margin: 0; font-size: 0.9rem; }
        .map-modal-title p { margin: 2px 0 0; font-size: 0.75rem; color: var(--text-dim); }
        #inline-map { width: 100%; height: 100%; }
    </style>
</head>

<body>
    <header class="hero">
        <div class="hero-content">
            <h1>Kaart Kruisingen</h1>
            <p>Intelligence platform for monitoring environmental permits intersecting with community paths in Flanders.</p>
        </div>
    </header>

    <main class="container">
        <section class="stats-grid" id="stats-container">
            <div class="stat-card">
                <div class="stat-value" id="total-matches">-</div>
                <div class="stat-label">Total Matches</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="active-matches">-</div>
                <div class="stat-label">Actief</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="mun-count">-</div>
                <div class="stat-label">Municipalities</div>
            </div>
        </section>

        <section class="controls">
            <input type="text" id="search" class="search-box" placeholder="Search by Project ID...">
            <select id="municipality-filter" class="filter-box">
                <option value="">All Municipalities</option>
            </select>
            <select id="status-filter" class="filter-box">
                <option value="all">Alles</option>
                <option value="active">Actief (openbaar onderzoek)</option>
                <option value="expired">Afgelopen</option>
            </select>
            <select id="sort-order" class="filter-box">
                <option value="deadline-asc">Eerst aflopend</option>
                <option value="deadline-desc">Laatst aflopend</option>
                <option value="date-desc">Nieuwste eerst</option>
                <option value="date-asc">Oudste eerst</option>
                <option value="municipality">Gemeente A-Z</option>
            </select>
        </section>

        <div class="matches-grid" id="matches-grid"></div>
    </main>

    <!-- Map Modal -->
    <div class="map-modal" id="map-modal">
        <div class="map-modal-content">
            <div class="map-modal-title" id="map-modal-title"></div>
            <button class="map-modal-close" onclick="closeMapModal()">Sluiten</button>
            <div id="inline-map"></div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // --- Date parsing helpers ---
        function parseDeadline(inzageStatus) {
            if (!inzageStatus) return null;
            const match = inzageStatus.match(/(\d{2})\.(\d{2})\.(\d{4})/);
            if (match) {
                const [, dd, mm, yyyy] = match;
                return new Date(yyyy, mm - 1, dd);
            }
            return null;
        }

        function isExpired(inzageStatus) {
            const deadline = parseDeadline(inzageStatus);
            if (!deadline) return true;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            return deadline < today;
        }

        function daysUntilDeadline(inzageStatus) {
            const deadline = parseDeadline(inzageStatus);
            if (!deadline) return null;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            return Math.ceil((deadline - today) / (1000 * 60 * 60 * 24));
        }

        function formatDeadline(inzageStatus) {
            const deadline = parseDeadline(inzageStatus);
            if (!deadline) {
                return `<span style="color: #94a3b8; font-style: italic;">${inzageStatus || 'Geen einddatum bekend'}</span>`;
            }
            const days = daysUntilDeadline(inzageStatus);
            if (days === null) return inzageStatus;
            if (days < 0) return `<span style="color: #94a3b8">${inzageStatus}</span>`;
            if (days === 0) return `<span style="color: #f43f5e; font-weight: bold;">Vandaag laatste dag!</span>`;
            if (days <= 3) return `<span style="color: #f43f5e; font-weight: bold;">${inzageStatus} (nog ${days} dag${days > 1 ? 'en' : ''})</span>`;
            if (days <= 7) return `<span style="color: #f59e0b">${inzageStatus} (nog ${days} dagen)</span>`;
            return `<span style="color: #22c55e">${inzageStatus}</span>`;
        }

        // --- Sorting ---
        function sortMatches(matches, sortOrder) {
            const sorted = [...matches];
            switch (sortOrder) {
                case 'deadline-asc':
                    return sorted.sort((a, b) => {
                        const expiredA = isExpired(a.permit_data.inzage_status);
                        const expiredB = isExpired(b.permit_data.inzage_status);
                        if (expiredA !== expiredB) return expiredA ? 1 : -1;
                        const dlA = parseDeadline(a.permit_data.inzage_status);
                        const dlB = parseDeadline(b.permit_data.inzage_status);
                        if (dlA && dlB) return dlA - dlB;
                        if (dlA) return -1;
                        if (dlB) return 1;
                        return 0;
                    });
                case 'deadline-desc':
                    return sorted.sort((a, b) => {
                        const expiredA = isExpired(a.permit_data.inzage_status);
                        const expiredB = isExpired(b.permit_data.inzage_status);
                        if (expiredA !== expiredB) return expiredA ? 1 : -1;
                        const dlA = parseDeadline(a.permit_data.inzage_status);
                        const dlB = parseDeadline(b.permit_data.inzage_status);
                        if (dlA && dlB) return dlB - dlA;
                        if (dlA) return -1;
                        if (dlB) return 1;
                        return 0;
                    });
                case 'date-desc':
                    return sorted.sort((a, b) => new Date(b.validated_at || 0) - new Date(a.validated_at || 0));
                case 'date-asc':
                    return sorted.sort((a, b) => new Date(a.validated_at || 0) - new Date(b.validated_at || 0));
                case 'municipality':
                    return sorted.sort((a, b) => a.municipality.localeCompare(b.municipality));
                default:
                    return sorted;
            }
        }

        // --- Map Modal ---
        let mapInstance = null;
        const ROAD_COLORS = ['#3b82f6', '#8b5cf6', '#22c55e', '#f59e0b', '#ef4444', '#06b6d4', '#ec4899'];

        function openMapModal(match) {
            const modal = document.getElementById('map-modal');
            modal.classList.add('active');

            const pData = match.permit_data;
            document.getElementById('map-modal-title').innerHTML = `
                <h4>${pData.projectnummer || pData.referentie_project || 'Onbekend Project'}</h4>
                <p>${match.municipality} • ${pData.handeling_omschrijving || ''}</p>
            `;

            // Destroy previous map
            if (mapInstance) {
                mapInstance.remove();
                mapInstance = null;
            }

            // Calculate center from permit geometry
            const permitGeom = match.permit_geom;
            let center = [50.9, 3.7]; // default Flanders
            if (permitGeom && permitGeom.coordinates) {
                const coords = permitGeom.coordinates;
                if (permitGeom.type === 'Polygon') {
                    const ring = coords[0];
                    const lats = ring.map(c => c[1]);
                    const lngs = ring.map(c => c[0]);
                    center = [
                        (Math.min(...lats) + Math.max(...lats)) / 2,
                        (Math.min(...lngs) + Math.max(...lngs)) / 2
                    ];
                } else if (permitGeom.type === 'MultiPolygon') {
                    const ring = coords[0][0];
                    const lats = ring.map(c => c[1]);
                    const lngs = ring.map(c => c[0]);
                    center = [
                        (Math.min(...lats) + Math.max(...lats)) / 2,
                        (Math.min(...lngs) + Math.max(...lngs)) / 2
                    ];
                }
            }

            mapInstance = L.map('inline-map').setView(center, 17);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(mapInstance);

            // NOTE: WMS layers (Atlas der Buurtwegen, Luchtfoto) are disabled because
            // GitHub Pages cannot resolve internal Flemish government DNS names.
            // The permit polygon and road geometries are still shown as GeoJSON overlays.

            // Permit polygon
            if (permitGeom) {
                const permitLayer = L.geoJSON(permitGeom, {
                    style: { color: '#ff7800', fillColor: '#ff7800', fillOpacity: 0.3, weight: 2 }
                }).addTo(mapInstance);
                permitLayer.bindPopup(`<strong>Omgevingsvergunning</strong><br>${pData.handeling_omschrijving || ''}`);
            }

            // Road geometries
            if (match.road_geoms && match.road_geoms.length > 0) {
                match.road_geoms.forEach((roadGeom, idx) => {
                    const color = ROAD_COLORS[idx % ROAD_COLORS.length];
                    const roadData = match.road_data; // first road's data as fallback
                    const roadName = roadData.road_name || roadData.NR || `Weg ${idx + 1}`;
                    L.geoJSON(roadGeom, {
                        style: { color: color, weight: 4 }
                    }).addTo(mapInstance).bindPopup(`<strong>Buurtweg ${idx + 1}</strong><br>${roadName} (${roadData.bron_bestand || 'Atlas'})`);
                });
            }

            // Fit bounds
            const allLayers = L.featureGroup();
            if (permitGeom) allLayers.addLayer(L.geoJSON(permitGeom));
            if (match.road_geoms) {
                match.road_geoms.forEach(rg => allLayers.addLayer(L.geoJSON(rg)));
            }
            if (allLayers.getLayers().length > 0) {
                mapInstance.fitBounds(allLayers.getBounds().pad(0.1));
            }
        }

        function closeMapModal() {
            document.getElementById('map-modal').classList.remove('active');
            if (mapInstance) {
                mapInstance.remove();
                mapInstance = null;
            }
        }

        // Close on backdrop click
        document.getElementById('map-modal').addEventListener('click', function(e) {
            if (e.target === this) closeMapModal();
        });
        // Close on Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeMapModal();
        });

        // --- Main ---
        let allMatches = [];
        let lastRenderedMatches = [];

        async function loadDashboard() {
            try {
                const response = await fetch('output_maps/matches.json');
                allMatches = await response.json();

                renderStats(allMatches);
                renderFilters(allMatches);
                applyFiltersAndSort();

                document.getElementById('search').addEventListener('input', applyFiltersAndSort);
                document.getElementById('municipality-filter').addEventListener('change', applyFiltersAndSort);
                document.getElementById('status-filter').addEventListener('change', applyFiltersAndSort);
                document.getElementById('sort-order').addEventListener('change', applyFiltersAndSort);

            } catch (error) {
                console.error('Error loading matches:', error);
                document.getElementById('matches-grid').innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 40px; background: rgba(255,0,0,0.1); border-radius: 20px;">
                        <h3>Geen data gevonden</h3>
                        <p>Zorg ervoor dat de kruising_checker.py is uitgevoerd en dat matches.json in output_maps staat.</p>
                    </div>`;
            }
        }

        function renderStats(matches) {
            document.getElementById('total-matches').innerText = matches.length;
            const municipalities = new Set(matches.map(m => m.municipality));
            document.getElementById('mun-count').innerText = municipalities.size;
            const activeCount = matches.filter(m => !isExpired(m.permit_data.inzage_status)).length;
            document.getElementById('active-matches').innerText = activeCount;
        }

        function renderFilters(matches) {
            const munFilter = document.getElementById('municipality-filter');
            const municipalities = [...new Set(matches.map(m => m.municipality))].sort();
            while (munFilter.options.length > 1) munFilter.remove(1);
            municipalities.forEach(mun => {
                const opt = document.createElement('option');
                opt.value = mun;
                opt.textContent = mun;
                munFilter.appendChild(opt);
            });
        }

        function applyFiltersAndSort() {
            const searchTerm = document.getElementById('search').value.toLowerCase();
            const munFilter = document.getElementById('municipality-filter').value;
            const statusFilter = document.getElementById('status-filter').value;
            const sortOrder = document.getElementById('sort-order').value;

            let filtered = allMatches.filter(m => {
                const matchesSearch = (m.permit_data.projectnummer || '').toLowerCase().includes(searchTerm) ||
                    (m.permit_data.referentie_project || '').toLowerCase().includes(searchTerm);
                const matchesMun = munFilter === "" || m.municipality === munFilter;
                let matchesStatus = true;
                if (statusFilter === 'active') matchesStatus = !isExpired(m.permit_data.inzage_status);
                else if (statusFilter === 'expired') matchesStatus = isExpired(m.permit_data.inzage_status);
                return matchesSearch && matchesMun && matchesStatus;
            });

            filtered = sortMatches(filtered, sortOrder);
            renderMatches(filtered);
        }

        function renderMatches(matches) {
            const grid = document.getElementById('matches-grid');
            grid.innerHTML = '';
            lastRenderedMatches = matches;

            if (matches.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-dim);">
                        <p>Geen resultaten gevonden.</p>
                    </div>`;
                return;
            }

            let lastExpired = false;

            matches.forEach((match, i) => {
                const pData = match.permit_data;
                const rData = match.road_data;
                const expired = isExpired(pData.inzage_status);

                if (expired && !lastExpired) {
                    const sep = document.createElement('div');
                    sep.style.cssText = 'grid-column: 1/-1; margin-top: 30px; margin-bottom: 10px; padding: 10px 20px; border-top: 2px solid rgba(255,255,255,0.1);';
                    sep.innerHTML = `<span style="color: var(--text-dim); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 2px;">Archief — Openbaar onderzoek afgelopen</span>`;
                    grid.appendChild(sep);
                }
                lastExpired = expired;

                const card = document.createElement('div');
                card.className = 'match-card';
                card.dataset.idx = i;
                if (expired) {
                    card.style.opacity = '0.6';
                    card.style.filter = 'grayscale(0.3)';
                }

                const deadlineHtml = formatDeadline(pData.inzage_status);
                const roadCount = match.road_count || 1;
                const hasGeometry = match.permit_geom && match.road_geoms;
                const mapIcon = hasGeometry
                    ? `<svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.3"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21 3 6"></polygon><line x1="9" y1="3" x2="9" y2="18"></line><line x1="15" y1="6" x2="15" y2="21"></line></svg>`
                    : `<svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.15"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`;

                card.innerHTML = `
                    <div class="card-map-link" title="${hasGeometry ? 'Bekijk kaart' : 'Kaart niet beschikbaar (oude entry)'}">
                        ${mapIcon}
                    </div>
                    <div class="card-content">
                        <span class="card-municipality">${match.municipality}</span>
                        <h3 class="card-title">${pData.projectnummer || pData.referentie_project || 'Onbekend Project'}</h3>
                        <p class="card-details">${pData.handeling_omschrijving || 'Geen omschrijving beschikbaar'}</p>
                        <div style="margin-top: 15px; font-size: 0.8rem; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px;">
                            <strong>Weg:</strong> ${rData.road_name || rData.NR || 'Onbekende buurtweg'} (${rData.bron_bestand || 'Atlas'})${roadCount > 1 ? ` <span style="color: var(--primary)">+${roadCount - 1} meer</span>` : ''}
                        </div>
                    </div>
                    <div class="card-footer">
                        <span style="font-size: 0.75rem; color: var(--text-dim)">${deadlineHtml}</span>
                        <a href="${pData.inzageloket_link || pData.project_link || '#'}" target="_blank" class="btn-icon" title="Bekijk op Inzageloket" onclick="event.stopPropagation()">
                            <i data-lucide="external-link" style="width: 18px"></i>
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        // Event delegation for map clicks — uses data-index on each card
        document.getElementById('matches-grid').addEventListener('click', function(e) {
            if (e.target.closest('.btn-icon')) return;
            const card = e.target.closest('.match-card');
            if (!card || card.dataset.idx === undefined) return;
            const idx = parseInt(card.dataset.idx);
            if (lastRenderedMatches[idx]) {
                openMapModal(lastRenderedMatches[idx]);
            }
        });

        loadDashboard();
    </script>
</body>

</html>
